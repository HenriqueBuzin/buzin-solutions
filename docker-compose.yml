name: buzin-solutions-dev

x-labels: &default-labels
  infra.project: buzin-solutions
  infra.environment: development
  infra.version: ${IMAGE_TAG:-local}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: buzin-solutions/backend:${IMAGE_TAG:-local}-dev
    labels: *default-labels
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      ENV: ${ENV:-development}
      SWAGGER_ENABLED: "true"
      TZ: America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8004}:8000"
    volumes:
      - ./backend:/app
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - __import__('urllib.request').request.urlopen('http://127.0.0.1:8000/api/v1/health').read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      - proxy-network

  frontend:
    image: buzin-solutions/frontend:${IMAGE_TAG:-local}-dev
    labels: *default-labels
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      ENV: ${ENV:-development}
      VITE_REACT_APP_LANGUAGE: ${VITE_REACT_APP_LANGUAGE:-pt-BR}
      TZ: America/Sao_Paulo
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3004}:3004"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3004/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      proxy-network:
        aliases:
          - buzin-solutions-dev

volumes:
  frontend_node_modules:

networks:
  proxy-network:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}
