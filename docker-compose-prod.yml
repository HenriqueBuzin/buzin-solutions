name: buzin-solutions

x-labels: &default-labels
  infra.project: buzin-solutions
  infra.environment: production
  infra.version: ${IMAGE_TAG:-local}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: buzin-solutions/backend:${IMAGE_TAG:-local}
    labels: *default-labels
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      ENV: ${ENV:-production}
      SWAGGER_ENABLED: "false"
      TZ: America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - __import__('urllib.request').request.urlopen('http://127.0.0.1:8000/api/v1/health').read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      - proxy-network

  frontend:
    image: buzin-solutions/frontend:${IMAGE_TAG:-local}
    labels: *default-labels
    build:
      context: ./frontend
      target: prod
      args:
        VITE_REACT_APP_LANGUAGE: ${VITE_REACT_APP_LANGUAGE:-pt-BR}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      ENV: ${ENV:-production}
      TZ: America/Sao_Paulo
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default-logging
    networks:
      proxy-network:
        aliases:
          - buzin-solutions

networks:
  proxy-network:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}
