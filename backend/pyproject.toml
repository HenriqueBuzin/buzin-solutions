[project]
name = "buzin-solutions-backend"
version = "1.0.0"
description = "API Flask da Buzin Solutions"
requires-python = "==3.14.6"
dependencies = [
    "flask==3.1.3",
    "flask-smorest==0.47.0",
    "gunicorn==26.0.0",
    "marshmallow==4.3.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
isort = "8.0.1"
mypy = "2.3.0"
pytest = "9.1.1"
pytest-cov = "7.1.0"
ruff = "0.16.0"

[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = [
    "unit: testes unitarios",
    "integration: testes de integracao",
    "regression: testes de regressao",
    "smoke: testes essenciais de saude",
]
pythonpath = ["."]
testpaths = ["tests"]
